#cloud-config
# Tooling VM bootstrap: .NET 10 SDK, sqlcmd, Azure CLI and basic tools.
# Progress is logged to /var/log/tooling-setup.log. The file
# /var/lib/tooling-ready exists once setup has finished.
package_update: true
packages:
  - curl
  - git
  - jq
  - unzip
  - ca-certificates
  - apt-transport-https
  - gnupg
write_files:
  - path: /usr/local/sbin/tooling-setup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euxo pipefail
      exec > >(tee -a /var/log/tooling-setup.log) 2>&1

      # .NET 10 SDK (includes the runtime), installed system-wide.
      curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
      bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
      ln -sf /usr/share/dotnet/dotnet /usr/local/bin/dotnet
      echo 'export DOTNET_CLI_TELEMETRY_OPTOUT=1' > /etc/profile.d/dotnet.sh

      # sqlcmd: the Go sqlcmd (supports Entra / managed identity auth), pinned release from GitHub.
      # The Microsoft apt repo for Ubuntu 24.04 only carries the older ODBC mssql-tools18, so
      # `apt-get install sqlcmd` fails there (found on the first live deployment).
      apt-get install -y bzip2
      curl -sSL -o /tmp/sqlcmd.tar.bz2 \
        https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
      mkdir -p /tmp/sqlcmd-x
      tar -xjf /tmp/sqlcmd.tar.bz2 -C /tmp/sqlcmd-x
      install -m 0755 /tmp/sqlcmd-x/sqlcmd /usr/local/bin/sqlcmd

      # Azure CLI, for `az login --identity` and inspection from the VM.
      curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      touch /var/lib/tooling-ready
runcmd:
  - [ /usr/local/sbin/tooling-setup.sh ]
